<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff775f">
    <title>糖果彈珠 | 打磚塊</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #173b43;
            --coral: #ff775f;
            --lemon: #ffe45e;
            --mint: #70e2c1;
            --paper: #fff8e7;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 30px 18px;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            color: var(--ink);
            background-color: #fff0d2;
            background-image: radial-gradient(#ffbf73 1.2px, transparent 1.2px), linear-gradient(135deg, #ffe8bd, #ffd4c6 58%, #f6d6ef);
            background-size: 22px 22px, cover;
            font-family: "Trebuchet MS", "Noto Sans TC", sans-serif;
        }

        .arcade {
            width: min(100%, 1000px);
            padding: clamp(16px, 3vw, 30px);
            border: 3px solid var(--ink);
            border-radius: 22px;
            background: var(--paper);
            box-shadow: 9px 10px 0 var(--ink), 0 24px 48px #a9534930;
            animation: arrive 550ms cubic-bezier(.2,.8,.2,1) both;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(18px) rotate(-.5deg); }
            to { opacity: 1; transform: translateY(0) rotate(0); }
        }

        .topline {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        .eyebrow {
            margin: 0 0 3px;
            color: #d85b48;
            font-size: .76rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.7rem, 4vw, 2.55rem);
            line-height: 1.05;
            color: var(--ink);
        }

        .stats {
            display: flex;
            gap: 9px;
            margin: 0;
        }

        .stat {
            min-width: 78px;
            padding: 7px 11px;
            border: 2px solid var(--ink);
            border-radius: 9px;
            background: #fff;
            box-shadow: 0 3px 0 var(--ink);
            text-align: center;
        }

        .stat dt {
            color: #547179;
            font-size: .68rem;
            font-weight: 800;
        }

        .stat dd {
            margin: 1px 0 0;
            font-size: 1.14rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        .screen-wrap {
            overflow: hidden;
            border: 3px solid var(--ink);
            border-radius: 13px;
            background: #113b49;
            box-shadow: 0 6px 0 #173b43;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 900 / 610;
            touch-action: none;
            cursor: crosshair;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-top: 16px;
        }

        .actions { display: flex; flex-wrap: wrap; gap: 9px; }

        button {
            min-height: 42px;
            padding: 8px 15px;
            border: 2px solid var(--ink);
            border-radius: 8px;
            color: var(--ink);
            background: var(--lemon);
            box-shadow: 0 3px 0 var(--ink);
            font: inherit;
            font-weight: 900;
            cursor: pointer;
            transition: transform 100ms ease, box-shadow 100ms ease, background 100ms ease;
        }

        button:hover { background: #fff078; transform: translateY(-1px); }
        button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
        button:focus-visible { outline: 3px solid #167f79; outline-offset: 3px; }
        button.secondary { background: var(--mint); }

        .hint {
            margin: 0;
            color: #416169;
            font-size: .88rem;
            font-weight: 700;
        }

        @media (max-width: 560px) {
            body { padding: 14px 10px; }
            .arcade { padding: 14px; border-radius: 16px; box-shadow: 5px 6px 0 var(--ink); }
            .topline { align-items: start; flex-direction: column; }
            .stats { width: 100%; }
            .stat { flex: 1; min-width: 0; }
            .toolbar { align-items: start; }
            .actions { width: 100%; }
            .actions button { flex: 1; }
            .hint { font-size: .8rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main class="arcade">
        <header class="topline">
            <div>
                <p class="eyebrow">SWEET ARCADE · NO. 07</p>
                <h1>糖果彈珠</h1>
            </div>
            <dl class="stats" aria-label="遊戲資訊">
                <div class="stat"><dt>分數</dt><dd id="score">0000</dd></div>
                <div class="stat"><dt>最高分</dt><dd id="best">0000</dd></div>
                <div class="stat"><dt>生命</dt><dd id="lives">3</dd></div>
            </dl>
        </header>

        <div class="screen-wrap">
            <canvas id="game" width="900" height="610" aria-label="打磚塊遊戲區"></canvas>
        </div>

        <footer class="toolbar">
            <div class="actions">
                <button id="startButton" type="button">開始遊戲</button>
                <button id="soundButton" class="secondary" type="button" aria-pressed="true">音效：開</button>
            </div>
            <p class="hint">← → 移動球拍，也可用滑鼠或手指 · 空白鍵發球／暫停</p>
        </footer>
    </main>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const livesEl = document.getElementById('lives');
        const startButton = document.getElementById('startButton');
        const soundButton = document.getElementById('soundButton');

        const W = canvas.width;
        const H = canvas.height;
        const colors = ['#ff6d68', '#ffb84f', '#ffe45e', '#69dfb2', '#54c8f3', '#bf85ef'];
        const paddle = { x: W / 2, y: H - 55, w: 132, h: 18, speed: 620 };
        const ball = { x: W / 2, y: H - 83, r: 10, vx: 0, vy: 0, stuck: true };
        const keys = new Set();
        const particles = [];
        const brickLayout = { cols: 10, rows: 6, w: 70, h: 23, gap: 9, top: 88, left: 41, depth: 8 };
        let bricks = [];
        let score = 0;
        let lives = 3;
        let level = 1;
        let best = Number(localStorage.getItem('candyBreakerBest') || 0);
        let running = false;
        let finished = false;
        let soundOn = true;
        let audio = null;
        let lastFrame = 0;
        let flash = 0;

        bestEl.textContent = String(best).padStart(4, '0');

        function makeBricks() {
            bricks = [];
            for (let row = 0; row < brickLayout.rows; row++) {
                for (let col = 0; col < brickLayout.cols; col++) {
                    bricks.push({
                        x: brickLayout.left + col * (brickLayout.w + brickLayout.gap),
                        y: brickLayout.top + row * (brickLayout.h + brickLayout.gap),
                        w: brickLayout.w,
                        h: brickLayout.h,
                        color: colors[(row + Math.floor(col / 2)) % colors.length],
                        alive: true,
                        points: (brickLayout.rows - row) * 10
                    });
                }
            }
        }

        function updateHud() {
            scoreEl.textContent = String(score).padStart(4, '0');
            livesEl.textContent = String(lives);
            if (score > best) {
                best = score;
                bestEl.textContent = String(best).padStart(4, '0');
                localStorage.setItem('candyBreakerBest', String(best));
            }
        }

        function enableAudio() {
            if (!soundOn) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            if (!audio) audio = new AudioContext();
            if (audio.state === 'suspended') audio.resume();
        }

        function tone(frequency, duration = 0.09, type = 'sine', volume = 0.045, endFrequency = frequency) {
            if (!soundOn || !audio) return;
            const oscillator = audio.createOscillator();
            const gain = audio.createGain();
            const now = audio.currentTime;
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, now);
            oscillator.frequency.exponentialRampToValueAtTime(Math.max(30, endFrequency), now + duration);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(volume, now + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            oscillator.connect(gain);
            gain.connect(audio.destination);
            oscillator.start(now);
            oscillator.stop(now + duration);
        }

        function resetBall() {
            ball.stuck = true;
            ball.x = paddle.x;
            ball.y = paddle.y - 25;
            ball.vx = 0;
            ball.vy = 0;
        }

        function startGame() {
            enableAudio();
            if (finished) {
                score = 0;
                lives = 3;
                level = 1;
                makeBricks();
                updateHud();
                finished = false;
            }
            if (!bricks.length) makeBricks();
            running = true;
            startButton.textContent = '暫停遊戲';
            resetBall();
        }

        function launchBall() {
            if (!running || !ball.stuck) return;
            ball.stuck = false;
            ball.vx = (Math.random() - 0.5) * 190;
            ball.vy = -430;
            tone(520, 0.11, 'triangle', 0.035, 760);
        }

        function setPaddleFromPointer(event) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            paddle.x = Math.max(paddle.w / 2 + 12, Math.min(W - paddle.w / 2 - 12, (event.clientX - rect.left) * scaleX));
            if (ball.stuck) ball.x = paddle.x;
        }

        function burst(x, y, color) {
            for (let i = 0; i < 9; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 65 + Math.random() * 190;
                particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 0.35 + Math.random() * 0.35, color });
            }
        }

        function loseLife() {
            lives--;
            updateHud();
            tone(220, 0.3, 'sawtooth', 0.055, 75);
            flash = 0.22;
            if (lives <= 0) {
                running = false;
                finished = true;
                startButton.textContent = '再玩一次';
            } else {
                resetBall();
            }
        }

        function update(dt) {
            if (!running) return;
            if (keys.has('ArrowLeft') || keys.has('a')) paddle.x -= paddle.speed * dt;
            if (keys.has('ArrowRight') || keys.has('d')) paddle.x += paddle.speed * dt;
            paddle.x = Math.max(paddle.w / 2 + 12, Math.min(W - paddle.w / 2 - 12, paddle.x));
            if (ball.stuck) {
                ball.x = paddle.x;
                ball.y = paddle.y - 25;
                return;
            }

            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;
            if (ball.x - ball.r < 12) { ball.x = 12 + ball.r; ball.vx = Math.abs(ball.vx); tone(290, 0.045, 'sine', 0.02, 340); }
            if (ball.x + ball.r > W - 12) { ball.x = W - 12 - ball.r; ball.vx = -Math.abs(ball.vx); tone(290, 0.045, 'sine', 0.02, 340); }
            if (ball.y - ball.r < 14) { ball.y = 14 + ball.r; ball.vy = Math.abs(ball.vy); tone(320, 0.05, 'sine', 0.025, 390); }

            if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r < paddle.y + paddle.h && ball.x > paddle.x - paddle.w / 2 && ball.x < paddle.x + paddle.w / 2) {
                ball.y = paddle.y - ball.r;
                const offset = (ball.x - paddle.x) / (paddle.w / 2);
                const speed = Math.min(650, Math.hypot(ball.vx, ball.vy) * 1.025);
                const angle = offset * 1.02;
                ball.vx = Math.sin(angle) * speed;
                ball.vy = -Math.cos(angle) * speed;
                tone(360, 0.07, 'triangle', 0.04, 620);
            }

            for (const brick of bricks) {
                if (!brick.alive) continue;
                const nearestX = Math.max(brick.x, Math.min(ball.x, brick.x + brick.w));
                const nearestY = Math.max(brick.y, Math.min(ball.y, brick.y + brick.h));
                const dx = ball.x - nearestX;
                const dy = ball.y - nearestY;
                if (dx * dx + dy * dy <= ball.r * ball.r) {
                    brick.alive = false;
                    score += brick.points;
                    updateHud();
                    burst(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color);
                    if (Math.abs(dx) > Math.abs(dy)) ball.vx *= -1;
                    else ball.vy *= -1;
                    tone(480 + (brick.y % 5) * 55, 0.085, 'triangle', 0.04, 790);
                    break;
                }
            }

            if (ball.y - ball.r > H) loseLife();
            if (bricks.every(brick => !brick.alive)) {
                level++;
                makeBricks();
                ball.vx *= 1.1;
                ball.vy *= 1.1;
                tone(620, 0.24, 'sine', 0.05, 1040);
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.x += particle.vx * dt;
                particle.y += particle.vy * dt;
                particle.vx *= 0.985;
                particle.vy *= 0.985;
                particle.life -= dt;
                if (particle.life <= 0) particles.splice(i, 1);
            }
            flash = Math.max(0, flash - dt);
        }

        function roundedRect(x, y, width, height, radius) {
            ctx.beginPath();
            ctx.roundRect(x, y, width, height, radius);
        }

        function drawBackground() {
            const sky = ctx.createLinearGradient(0, 0, 0, H);
            sky.addColorStop(0, '#174d5b');
            sky.addColorStop(1, '#102f43');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, W, H);
            ctx.save();
            ctx.globalAlpha = 0.12;
            ctx.strokeStyle = '#9ff5de';
            ctx.lineWidth = 1;
            for (let x = -H; x < W; x += 38) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x + H, H);
                ctx.stroke();
            }
            ctx.restore();
            ctx.strokeStyle = '#8de5cf';
            ctx.lineWidth = 2;
            ctx.strokeRect(12, 14, W - 24, H - 28);
        }

        function drawBrick(brick) {
            const d = brickLayout.depth;
            ctx.save();
            ctx.shadowColor = '#071e2c99';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 5;
            ctx.fillStyle = '#072b39';
            ctx.beginPath();
            ctx.moveTo(brick.x, brick.y + 4);
            ctx.lineTo(brick.x + d, brick.y);
            ctx.lineTo(brick.x + brick.w, brick.y);
            ctx.lineTo(brick.x + brick.w, brick.y + brick.h - 3);
            ctx.lineTo(brick.x + brick.w - d, brick.y + brick.h + 4);
            ctx.lineTo(brick.x, brick.y + brick.h + 4);
            ctx.closePath();
            ctx.fill();
            ctx.shadowColor = 'transparent';
            const face = ctx.createLinearGradient(brick.x, brick.y, brick.x, brick.y + brick.h);
            face.addColorStop(0, '#ffffff');
            face.addColorStop(0.2, brick.color);
            face.addColorStop(1, brick.color);
            ctx.fillStyle = face;
            roundedRect(brick.x, brick.y, brick.w - 3, brick.h, 5);
            ctx.fill();
            ctx.fillStyle = '#ffffff72';
            roundedRect(brick.x + 5, brick.y + 4, brick.w - 15, 3, 2);
            ctx.fill();
            ctx.restore();
        }

        function drawPaddle() {
            const x = paddle.x - paddle.w / 2;
            const y = paddle.y;
            ctx.save();
            ctx.shadowColor = '#70e2c188';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#0b2937';
            roundedRect(x - 1, y + 4, paddle.w + 2, paddle.h, 9);
            ctx.fill();
            const gradient = ctx.createLinearGradient(0, y, 0, y + paddle.h);
            gradient.addColorStop(0, '#f6ffb6');
            gradient.addColorStop(0.3, '#71e4c0');
            gradient.addColorStop(1, '#18a995');
            ctx.fillStyle = gradient;
            roundedRect(x, y, paddle.w, paddle.h, 8);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffffb0';
            roundedRect(x + 11, y + 3, paddle.w - 22, 3, 2);
            ctx.fill();
            ctx.restore();
        }

        function drawBall() {
            ctx.save();
            ctx.shadowColor = '#fff4a0';
            ctx.shadowBlur = 21;
            const gradient = ctx.createRadialGradient(ball.x - 3, ball.y - 4, 1, ball.x, ball.y, ball.r + 2);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(0.35, '#fff7a8');
            gradient.addColorStop(1, '#ff9e42');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawOverlay(title, subtitle) {
            ctx.fillStyle = '#0b2639b8';
            ctx.fillRect(12, 14, W - 24, H - 28);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#fff4b4';
            ctx.font = '900 48px Trebuchet MS, sans-serif';
            ctx.shadowColor = '#ff956a';
            ctx.shadowBlur = 18;
            ctx.fillText(title, W / 2, H / 2 - 22);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#f4ffff';
            ctx.font = '700 19px Trebuchet MS, sans-serif';
            ctx.fillText(subtitle, W / 2, H / 2 + 22);
            ctx.textAlign = 'left';
        }

        function draw() {
            drawBackground();
            for (const brick of bricks) if (brick.alive) drawBrick(brick);
            drawPaddle();
            drawBall();
            for (const particle of particles) {
                ctx.globalAlpha = Math.max(0, particle.life / 0.7);
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#e6fff4';
            ctx.font = '800 14px Trebuchet MS, sans-serif';
            ctx.fillText(`LEVEL ${String(level).padStart(2, '0')}`, 27, 43);
            if (!running && !finished) drawOverlay('準備好了嗎？', '移動球拍，按空白鍵或點擊發球');
            if (!running && finished) drawOverlay('再來一局！', `本局 ${score} 分 · 按「再玩一次」重新挑戰`);
            if (!running && !finished && startButton.textContent === '暫停遊戲') drawOverlay('先休息一下', '按空白鍵繼續');
            if (flash > 0) {
                ctx.fillStyle = `rgba(255, 99, 105, ${flash * 0.7})`;
                ctx.fillRect(12, 14, W - 24, H - 28);
            }
        }

        function frame(timestamp) {
            const dt = Math.min((timestamp - (lastFrame || timestamp)) / 1000, 0.03);
            lastFrame = timestamp;
            update(dt);
            draw();
            requestAnimationFrame(frame);
        }

        startButton.addEventListener('click', () => {
            if (running) {
                running = false;
                startButton.textContent = '繼續遊戲';
            } else {
                if (startButton.textContent === '繼續遊戲') {
                    running = true;
                    enableAudio();
                    startButton.textContent = '暫停遊戲';
                } else {
                    startGame();
                }
            }
        });

        soundButton.addEventListener('click', () => {
            soundOn = !soundOn;
            soundButton.textContent = soundOn ? '音效：開' : '音效：關';
            soundButton.setAttribute('aria-pressed', String(soundOn));
            if (soundOn) enableAudio();
        });

        canvas.addEventListener('pointermove', setPaddleFromPointer);
        canvas.addEventListener('pointerdown', event => {
            enableAudio();
            setPaddleFromPointer(event);
            if (!running && !finished) startGame();
            launchBall();
        });

        document.addEventListener('keydown', event => {
            if (['ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
            keys.add(event.key);
            if (event.key === ' ' && !event.repeat) {
                enableAudio();
                if (!running && !finished) startGame();
                else if (running && ball.stuck) launchBall();
                else if (running) {
                    running = false;
                    startButton.textContent = '繼續遊戲';
                } else if (startButton.textContent === '繼續遊戲') {
                    running = true;
                    startButton.textContent = '暫停遊戲';
                }
            }
            if (event.key === 'Enter' && !running) startGame();
        });
        document.addEventListener('keyup', event => keys.delete(event.key));
        window.addEventListener('blur', () => keys.clear());

        makeBricks();
        updateHud();
        requestAnimationFrame(frame);
    </script>
</body>
</html>
